<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Studio Pro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.css">

    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background: #0f111a; color: white; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        .CodeMirror { flex: 1; height: auto; font-family: 'Fira Code', monospace; font-size: 14px; }
        #rich-editor { display: none; flex: 1; background: white; color: black; padding: 30px; overflow-y: auto; outline: none; }
        .word-mode #rich-editor { display: block; }
        .word-mode .CodeMirror { display: none; }
        .toolbar-word { display: none; gap: 5px; padding: 8px; background: #eee; border-radius: 8px 8px 0 0; }
        .word-mode .toolbar-word { display: flex; }
        #terminal { display: none; height: 180px; background: #000; color: #00ff00; padding: 10px; font-family: monospace; overflow-y: auto; border-top: 2px solid #333; }
        .show-terminal #terminal { display: block; }
        @media (max-width: 768px) { .btn-text { display: none; } }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom px-3">
        <button class="btn btn-outline-secondary me-2 d-md-none" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile"><i class="bi bi-list"></i></button>
        <span class="navbar-brand mb-0 h1">AzDev Studio</span>
        <div class="ms-auto d-flex align-items-center gap-2">
            <div class="btn-group btn-group-sm">
                <button id="btn-code" class="btn btn-primary active" onclick="switchMode('code')">Code</button>
                <button id="btn-word" class="btn btn-outline-light" onclick="switchMode('word')">Word</button>
            </div>
            <button class="btn btn-sm btn-warning" onclick="runPreview()"><i class="bi bi-play"></i> Preview</button>
            <button class="btn btn-sm btn-info" onclick="runPython()"><i class="bi bi-terminal"></i> Python</button>
        </div>
    </nav>

    <div class="row g-0 flex-grow-1 overflow-hidden">
        <div class="col-md-3 col-lg-2 bg-body-tertiary border-end d-none d-md-block p-3 overflow-auto">
            <div class="d-flex justify-content-between mb-3"><small class="fw-bold">ARQUIVOS</small><button class="btn btn-sm btn-link p-0" onclick="fetchFileList()"><i class="bi bi-arrow-clockwise"></i></button></div>
            <div class="list-group list-group-flush" id="fileList"></div>
        </div>

        <div class="col-md-9 col-lg-10 d-flex flex-column overflow-hidden">
            <div class="toolbar-word border-bottom p-2">
                <button class="btn btn-sm btn-dark" onclick="execCmd('bold')">B</button>
                <button class="btn btn-sm btn-dark" onclick="execCmd('italic')">I</button>
                <button class="btn btn-sm btn-dark" onclick="execCmd('insertUnorderedList')"><i class="bi bi-list-ul"></i></button>
            </div>

            <div class="p-2 border-bottom d-flex gap-2 bg-dark">
                <input type="text" id="fileName" class="form-control form-control-sm" placeholder="ex: index.html" style="max-width: 200px;" oninput="applyTemplate(this.value)">
                <button class="btn btn-sm btn-success" onclick="saveToGitHub()"><i class="bi bi-save"></i> <span class="btn-text">Salvar</span></button>
                <button class="btn btn-sm btn-danger" onclick="deleteFile()"><i class="bi bi-trash"></i></button>
                <span id="status-badge" class="badge bg-secondary ms-auto align-self-center">Pronto</span>
            </div>
            
            <textarea id="code-editor"></textarea>
            <div id="rich-editor" contenteditable="true"></div>
            
            <div id="terminal">
                <div class="d-flex justify-content-between border-bottom border-secondary mb-1">
                    <small>TERMINAL PYTHON</small>
                    <button class="btn btn-sm text-danger p-0" onclick="closeTerminal()"><i class="bi bi-x"></i></button>
                </div>
                <div id="output"></div>
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-start" id="sidebarMobile"><div class="offcanvas-body p-0"><div class="list-group list-group-flush" id="fileListMobile"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

<script>
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com/api/notes";
    let pyodideInstance = null;

    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        lineNumbers: true, theme: "dracula", mode: "python",
        extraKeys: {"Ctrl-Space": "autocomplete"},
        lineWrapping: true
    });

    // SISTEMA DE TEMPLATES
    const templates = {
        html: `<!DOCTYPE html>\n<html lang="pt-br">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Novo Projeto AzDev</title>\n    \n    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">\n    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">\n</head>\n<body class="bg-light">\n\n    <div class="container py-5">\n        <h1 class="text-primary text-center">Olá André!</h1>\n        <p class="text-center">Template Bootstrap carregado com sucesso.</p>\n    </div>\n\n    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"><\/script>\n</body>\n</html>`,
        py: `# Projeto Python - AzDev\ndef main():\n    print("Olá André! O terminal Python está funcionando.")\n\nif __name__ == "__main__":\n    main()`,
        js: `// AzDev Script\nconsole.log("JavaScript carregado!");\n\ndocument.addEventListener('DOMContentLoaded', () => {\n    // Seu código aqui\n});`,
        css: `/* AzDev Styles */\nbody {\n    background-color: #f4f4f4;\n    font-family: Arial, sans-serif;\n}`
    };

    function applyTemplate(val) {
        if (editor.getValue().trim() !== "") return; // Não sobrescreve se já houver código
        const ext = val.split('.').pop().toLowerCase();
        if (templates[ext]) {
            editor.setValue(templates[ext]);
            const modes = { html: 'htmlmixed', py: 'python', js: 'javascript', css: 'css' };
            editor.setOption("mode", modes[ext] || 'text');
        }
    }

    async function runPython() {
        document.body.classList.add('show-terminal');
        const out = document.getElementById('output');
        out.innerHTML = "Iniciando Python Engine...";
        try {
            if (!pyodideInstance) pyodideInstance = await loadPyodide();
            pyodideInstance.runPython(`import sys\nimport io\nsys.stdout = io.StringIO()`);
            await pyodideInstance.runPythonAsync(editor.getValue());
            out.innerHTML = pyodideInstance.runPython("sys.stdout.getvalue()") || "Executado com sucesso.";
        } catch (err) { out.innerHTML = `<span class="text-danger">${err}</span>`; }
    }

    function runPreview() {
        const win = window.open("", "Preview", "width=800,height=600");
        win.document.write(editor.getValue()); win.document.close();
    }

    // --- REUTILIZANDO FUNÇÕES API ANTERIORES (Save, Load, Delete, List) ---
    async function fetchFileList() {
        try {
            const r = await fetch(`${BACKEND_URL}?t=${Date.now()}`);
            const files = await r.json();
            const render = (id) => {
                const el = document.getElementById(id); el.innerHTML = '';
                files.forEach(f => {
                    if(f.type === 'file') {
                        const btn = document.createElement('button');
                        btn.className = 'list-group-item list-group-item-action border-0 small';
                        btn.innerHTML = `<i class="bi bi-file-code me-2"></i>${f.name}`;
                        btn.onclick = () => loadFile(f.name);
                        el.appendChild(btn);
                    }
                });
            };
            render('fileList'); render('fileListMobile');
        } catch (e) { setStatus("Erro", "danger"); }
    }

    async function loadFile(name) {
        setStatus("Abrindo...", "info");
        try {
            const r = await fetch(`${BACKEND_URL}/${name}`);
            const data = await r.json();
            const content = decodeURIComponent(escape(atob(data.content)));
            document.getElementById('fileName').value = data.name;
            editor.setValue(content);
            setStatus("Pronto", "success");
        } catch (e) { setStatus("Erro", "danger"); }
    }

    async function saveToGitHub() {
        const name = document.getElementById('fileName').value;
        if (!name) return alert("Dê um nome!");
        setStatus("Salvando...", "warning");
        try {
            let sha = "";
            const check = await fetch(`${BACKEND_URL}/${name}`);
            if (check.ok) { const d = await check.json(); sha = d.sha; }
            await fetch(`${BACKEND_URL}/${name}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `AzDev Update`,
                    content: btoa(unescape(encodeURIComponent(editor.getValue()))),
                    sha: sha || null
                })
            });
            setStatus("Salvo!", "success"); fetchFileList();
        } catch (e) { setStatus("Erro", "danger"); }
    }

    async function deleteFile() {
        const name = document.getElementById('fileName').value;
        if (!name || !confirm("Excluir?")) return;
        try {
            const check = await fetch(`${BACKEND_URL}/${name}`);
            const d = await check.json();
            await fetch(`${BACKEND_URL}/${name}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Delete", sha: d.sha })
            });
            document.getElementById('fileName').value = ""; editor.setValue(""); fetchFileList();
        } catch (e) { setStatus("Erro", "danger"); }
    }

    function switchMode(mode) {
        const rich = document.getElementById('rich-editor');
        if(mode === 'word') { document.body.classList.add('word-mode'); rich.innerHTML = editor.getValue(); }
        else { document.body.classList.remove('word-mode'); editor.setValue(rich.innerHTML); }
    }

    function closeTerminal() { document.body.classList.remove('show-terminal'); }
    function execCmd(cmd) { document.execCommand(cmd, false, null); }
    function setStatus(msg, type) { const b = document.getElementById('status-badge'); b.innerText = msg; b.className = `badge bg-${type}`; }
    window.onload = fetchFileList;
</script>
</body>
</html>
