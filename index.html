<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Studio Pro - Fixed Layout</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.css">

    <style>
        /* --- LAYOUT FIXO (A Mágica acontece aqui) --- */
        body, html { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; /* Impede a página toda de rolar */
            background: #0f111a; 
            color: white; 
        }

        .app-container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* O Navbar e Toolbar não encolhem */
        .fixed-header {
            flex-shrink: 0; 
            z-index: 1000;
        }

        /* A área principal ocupa o espaço que sobra */
        .main-workspace {
            flex-grow: 1;
            display: flex;
            overflow: hidden; /* Segura o conteúdo dentro */
            position: relative;
        }

        /* Coluna do Editor */
        .editor-column {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0; /* Correção para flexbox não estourar */
        }

        /* CodeMirror (Editor de Código) */
        .CodeMirror { 
            flex-grow: 1; 
            height: 100% !important; /* Força ocupar altura restante */
            font-family: 'Fira Code', monospace; 
            font-size: 14px; 
        }

        /* Editor de Texto Rico (Word) */
        #rich-editor { 
            display: none; 
            flex-grow: 1; 
            background: white; 
            color: black; 
            padding: 30px; 
            overflow-y: auto; /* O Scroll acontece AQUI DENTRO */
            outline: none; 
        }

        /* Modos de exibição */
        .word-mode #rich-editor { display: block; }
        .word-mode .CodeMirror { display: none; }
        
        /* Toolbar do Word (escondida por padrão) */
        .toolbar-word { display: none; gap: 5px; padding: 8px; background: #eee; border-bottom: 1px solid #ccc; flex-shrink: 0; }
        .word-mode .toolbar-word { display: flex; }

        /* Terminal */
        #terminal { 
            display: none; 
            height: 30%; /* Altura fixa quando aberto */
            background: #000; 
            color: #00ff00; 
            padding: 10px; 
            font-family: monospace; 
            overflow-y: auto; 
            border-top: 2px solid #333; 
            flex-shrink: 0;
        }
        .show-terminal #terminal { display: block; }

        /* Ajustes Mobile */
        @media (max-width: 768px) { 
            .btn-text { display: none; } 
            .editor-column { width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom px-3 fixed-header">
        <button class="btn btn-outline-secondary me-2 d-md-none" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
            <i class="bi bi-list"></i>
        </button>
        <span class="navbar-brand mb-0 h1">AzDev Studio</span>
        <div class="ms-auto d-flex align-items-center gap-2">
            <div class="btn-group btn-group-sm">
                <button id="btn-code" class="btn btn-primary active" onclick="switchMode('code')">Code</button>
                <button id="btn-word" class="btn btn-outline-light" onclick="switchMode('word')">Word</button>
            </div>
            <button class="btn btn-sm btn-warning" onclick="runPreview()"><i class="bi bi-play"></i></button>
            <button class="btn btn-sm btn-info" onclick="runPython()"><i class="bi bi-terminal"></i></button>
        </div>
    </nav>

    <div class="main-workspace">
        
        <div class="col-md-3 col-lg-2 bg-body-tertiary border-end d-none d-md-block p-3 overflow-auto">
            <div class="d-flex justify-content-between mb-3">
                <small class="fw-bold">ARQUIVOS</small>
                <button class="btn btn-sm btn-link p-0" onclick="fetchFileList()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="list-group list-group-flush" id="fileList"></div>
        </div>

        <div class="editor-column">
            
            <div class="p-2 border-bottom d-flex gap-2 bg-dark fixed-header align-items-center">
                <input type="text" id="fileName" class="form-control form-control-sm" placeholder="nome-arquivo.txt" style="max-width: 200px;" oninput="applyTemplate(this.value)">
                
                <button class="btn btn-sm btn-success" onclick="saveToGitHub()">
                    <i class="bi bi-save"></i> <span class="btn-text">Salvar</span>
                </button>
                
                <button class="btn btn-sm btn-danger" onclick="deleteFile()">
                    <i class="bi bi-trash"></i>
                </button>
                
                <span id="status-badge" class="badge bg-secondary ms-auto">Pronto</span>
            </div>

            <div class="toolbar-word">
                <button class="btn btn-sm btn-dark" onclick="execCmd('bold')"><b>B</b></button>
                <button class="btn btn-sm btn-dark" onclick="execCmd('italic')"><i>I</i></button>
                <button class="btn btn-sm btn-dark" onclick="execCmd('insertUnorderedList')"><i class="bi bi-list-ul"></i></button>
            </div>

            <textarea id="code-editor"></textarea>
            <div id="rich-editor" contenteditable="true"></div>
            
            <div id="terminal">
                <div class="d-flex justify-content-between border-bottom border-secondary mb-1">
                    <small>TERMINAL PYTHON</small>
                    <button class="btn btn-sm text-danger p-0" onclick="closeTerminal()"><i class="bi bi-x"></i></button>
                </div>
                <div id="output"></div>
            </div>

        </div>
    </div>
</div>

<div class="offcanvas offcanvas-start" id="sidebarMobile">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Arquivos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0">
        <div class="list-group list-group-flush" id="fileListMobile"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>

<script>
    // --- LÓGICA DO FRONTEND ---
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com/api/notes"; // Seu backend
    let pyodideInstance = null;

    // Configuração do CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        lineNumbers: true, 
        theme: "dracula", 
        mode: "python",
        extraKeys: {"Ctrl-Space": "autocomplete"},
        lineWrapping: true
    });

    // SISTEMA DE TEMPLATES
    const templates = {
        html: `<!DOCTYPE html>\n<html lang="pt-br">\n<head>\n    <meta charset="UTF-8">\n    <title>Novo Projeto</title>\n</head>\n<body>\n    <h1>Olá Mundo</h1>\n</body>\n</html>`,
        py: `def main():\n    print("Olá André!")\n\nif __name__ == "__main__":\n    main()`,
        js: `console.log("Olá JS");`,
        css: `body { background: #f4f4f4; }`
    };

    function applyTemplate(val) {
        if (editor.getValue().trim() !== "") return;
        const ext = val.split('.').pop().toLowerCase();
        if (templates[ext]) {
            editor.setValue(templates[ext]);
            const modes = { html: 'htmlmixed', py: 'python', js: 'javascript', css: 'css' };
            editor.setOption("mode", modes[ext] || 'text');
        }
    }

    // --- FUNÇÕES DE API E UI ---
    
    async function runPython() {
        document.body.classList.add('show-terminal');
        const out = document.getElementById('output');
        out.innerHTML = "Iniciando Python...";
        try {
            if (!pyodideInstance) pyodideInstance = await loadPyodide();
            pyodideInstance.runPython(`import sys\nimport io\nsys.stdout = io.StringIO()`);
            await pyodideInstance.runPythonAsync(editor.getValue());
            out.innerHTML = pyodideInstance.runPython("sys.stdout.getvalue()") || "Executado.";
        } catch (err) { out.innerHTML = `<span class="text-danger">${err}</span>`; }
    }

    function runPreview() {
        const win = window.open("", "Preview", "width=800,height=600");
        win.document.write(editor.getValue()); win.document.close();
    }

    async function fetchFileList() {
        try {
            const r = await fetch(`${BACKEND_URL}?t=${Date.now()}`);
            const files = await r.json();
            const render = (id) => {
                const el = document.getElementById(id); el.innerHTML = '';
                files.forEach(f => {
                    if(f.type === 'file') {
                        const btn = document.createElement('button');
                        btn.className = 'list-group-item list-group-item-action border-0 small';
                        btn.innerHTML = `<i class="bi bi-file-code me-2"></i>${f.name}`;
                        btn.onclick = () => loadFile(f.name);
                        el.appendChild(btn);
                    }
                });
            };
            render('fileList'); render('fileListMobile');
        } catch (e) { setStatus("Erro lista", "danger"); }
    }

    async function loadFile(name) {
        setStatus("Abrindo...", "info");
        try {
            const r = await fetch(`${BACKEND_URL}/${name}`);
            const data = await r.json();
            const content = decodeURIComponent(escape(atob(data.content)));
            document.getElementById('fileName').value = data.name;
            editor.setValue(content);
            setStatus("Carregado", "success");
        } catch (e) { setStatus("Erro load", "danger"); }
    }

    async function saveToGitHub() {
        const name = document.getElementById('fileName').value;
        if (!name) return alert("Dê um nome!");
        setStatus("Salvando...", "warning");
        try {
            let sha = "";
            // Tenta pegar o SHA se o arquivo existir
            try {
                const check = await fetch(`${BACKEND_URL}/${name}`);
                if (check.ok) { const d = await check.json(); sha = d.sha; }
            } catch(e) {} // Se der erro no check, assume que é novo

            await fetch(`${BACKEND_URL}/${name}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Update ${name}`,
                    content: btoa(unescape(encodeURIComponent(editor.getValue()))),
                    sha: sha || null
                })
            });
            setStatus("Salvo!", "success"); fetchFileList();
        } catch (e) { setStatus("Erro save", "danger"); }
    }

    async function deleteFile() {
        const name = document.getElementById('fileName').value;
        if (!name || !confirm("Excluir?")) return;
        try {
            const check = await fetch(`${BACKEND_URL}/${name}`);
            const d = await check.json();
            await fetch(`${BACKEND_URL}/${name}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Delete", sha: d.sha })
            });
            document.getElementById('fileName').value = ""; editor.setValue(""); fetchFileList();
        } catch (e) { setStatus("Erro delete", "danger"); }
    }

    // Controle de Modo (Code / Word)
    function switchMode(mode) {
        const rich = document.getElementById('rich-editor');
        const codeBtn = document.getElementById('btn-code');
        const wordBtn = document.getElementById('btn-word');

        if(mode === 'word') { 
            document.body.classList.add('word-mode'); 
            rich.innerHTML = editor.getValue(); 
            codeBtn.classList.remove('active', 'btn-primary'); codeBtn.classList.add('btn-outline-light');
            wordBtn.classList.add('active', 'btn-primary'); wordBtn.classList.remove('btn-outline-light');
        } else { 
            document.body.classList.remove('word-mode'); 
            editor.setValue(rich.innerText); // Pega texto simples de volta
            wordBtn.classList.remove('active', 'btn-primary'); wordBtn.classList.add('btn-outline-light');
            codeBtn.classList.add('active', 'btn-primary'); codeBtn.classList.remove('btn-outline-light');
        }
    }

    function closeTerminal() { document.body.classList.remove('show-terminal'); }
    function execCmd(cmd) { document.execCommand(cmd, false, null); }
    function setStatus(msg, type) { const b = document.getElementById('status-badge'); b.innerText = msg; b.className = `badge bg-${type}`; }
    
    window.onload = fetchFileList;
</script>

</body>
</html>
