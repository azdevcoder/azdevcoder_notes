<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Studio Pro - Ultimate</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/css/xterm.min.css">

    <style>
        /* --- LAYOUT FIXO (App-like) --- */
        body, html { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; /* Impede rolagem da página inteira */
            background: #0f111a; 
            color: #e6edf3; 
            font-family: 'Segoe UI', sans-serif;
        }

        .app-container { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* Elementos Fixos (Navbar, Toolbar) */
        .fixed-header { 
            flex-shrink: 0; 
            z-index: 1000; 
            background: #161b22 !important;
            border-bottom: 1px solid #30363d !important;
        }

        /* Workspace Principal */
        .main-workspace { 
            flex-grow: 1; 
            display: flex; 
            overflow: hidden; 
            position: relative; 
        }

        /* Coluna Lateral (Arquivos) */
        .sidebar-col {
            background: #0d1117;
            border-right: 1px solid #30363d;
        }

        /* Coluna do Editor */
        .editor-column { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            min-width: 0; 
        }

        /* Wrapper dos Editores (Onde ocorre a rolagem do conteúdo) */
        .editor-wrapper { 
            flex-grow: 1; 
            position: relative; 
            overflow: hidden; 
            background: #0d1117;
        }

        /* CodeMirror customização */
        .CodeMirror { 
            height: 100% !important; 
            font-family: 'Fira Code', monospace; 
            font-size: 14px; 
            background: #0d1117 !important;
        }

        /* Editor Visual (Word) */
        #rich-editor { 
            display: none; 
            height: 100%; 
            background: #ffffff; 
            color: #24292f; 
            padding: 40px; 
            overflow-y: auto; 
            outline: none; 
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap; /* Mantém parágrafos corretamente */
        }

        /* Modos */
        .word-mode #rich-editor { display: block; }
        .word-mode .CodeMirror { display: none; }
        
        .toolbar-word { 
            display: none; 
            gap: 5px; 
            padding: 8px; 
            background: #f6f8fa; 
            border-bottom: 1px solid #d0d7de; 
            flex-shrink: 0; 
        }
        .word-mode .toolbar-word { display: flex; }

        /* Área do Terminal */
        #terminal-container { 
            height: 35%; 
            background: #0d1117; 
            border-top: 1px solid #30363d; 
            display: none; 
            flex-direction: column; 
            flex-shrink: 0; 
        }
        .show-terminal #terminal-container { display: flex; }
        .show-terminal .editor-wrapper { height: 65%; } /* Reduz editor */
        
        #xterm-wrapper { 
            flex-grow: 1; 
            overflow: hidden; 
            padding: 10px; 
            background: #000;
        }

        /* Listas de Arquivos */
        .list-group-item {
            background: transparent;
            color: #e6edf3;
            border-bottom: 1px solid #30363d;
        }
        .list-group-item:hover { background: #161b22; color: #58a6ff; }

        @media (max-width: 768px) { 
            .btn-text { display: none; } 
            .editor-column { width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="navbar navbar-expand-lg fixed-header px-3">
        <button class="btn btn-outline-secondary me-2 d-md-none border-0" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
            <i class="bi bi-list"></i>
        </button>
        <span class="navbar-brand mb-0 h1 text-white"><i class="bi bi-code-square me-2 text-primary"></i>AzDev Studio</span>
        
        <div class="ms-auto d-flex align-items-center gap-2">
            <div class="btn-group btn-group-sm">
                <button id="btn-code" class="btn btn-primary active" onclick="switchMode('code')">Code</button>
                <button id="btn-word" class="btn btn-outline-secondary" onclick="switchMode('word')">Doc</button>
            </div>
            <button class="btn btn-sm btn-outline-warning" onclick="runPreview()" title="Preview HTML"><i class="bi bi-play-fill"></i></button>
            <button class="btn btn-sm btn-outline-info" onclick="toggleTerminal()" title="Terminal/Python"><i class="bi bi-terminal-fill"></i></button>
        </div>
    </nav>

    <div class="main-workspace">
        
        <div class="col-md-3 col-lg-2 sidebar-col d-none d-md-block p-0 overflow-auto">
            <div class="d-flex justify-content-between align-items-center p-3 border-bottom border-secondary">
                <small class="fw-bold text-muted">EXPLORER</small>
                <button class="btn btn-sm btn-link text-white p-0" onclick="fetchFileList()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="list-group list-group-flush" id="fileList">
                <div class="text-center mt-4 text-muted small">Carregando...</div>
            </div>
        </div>

        <div class="editor-column">
            
            <div class="p-2 d-flex gap-2 align-items-center fixed-header">
                <div class="input-group input-group-sm" style="max-width: 250px;">
                    <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-file-earmark"></i></span>
                    <input type="text" id="fileName" class="form-control bg-dark text-white border-secondary" placeholder="nome-arquivo.ext" oninput="applyTemplate(this.value)">
                </div>
                
                <button class="btn btn-sm btn-success" onclick="saveToGitHub()">
                    <i class="bi bi-cloud-arrow-up-fill"></i> <span class="btn-text">Salvar</span>
                </button>
                
                <button class="btn btn-sm btn-danger ms-auto" onclick="deleteFile()">
                    <i class="bi bi-trash"></i>
                </button>
                
                <span id="status-badge" class="badge bg-secondary">Pronto</span>
            </div>

            <div class="toolbar-word">
                <button class="btn btn-sm btn-light border" onclick="execCmd('bold')" title="Negrito"><b>B</b></button>
                <button class="btn btn-sm btn-light border" onclick="execCmd('italic')" title="Itálico"><i>I</i></button>
                <button class="btn btn-sm btn-light border" onclick="execCmd('underline')" title="Sublinhado"><u>U</u></button>
                <div class="vr mx-1"></div>
                <button class="btn btn-sm btn-light border" onclick="execCmd('insertUnorderedList')"><i class="bi bi-list-ul"></i></button>
                <button class="btn btn-sm btn-light border" onclick="execCmd('insertOrderedList')"><i class="bi bi-list-ol"></i></button>
            </div>

            <div class="editor-wrapper">
                <textarea id="code-editor"></textarea>
                <div id="rich-editor" contenteditable="true" spellcheck="false"></div>
            </div>
            
            <div id="terminal-container">
                <div class="d-flex justify-content-between align-items-center bg-dark px-3 py-1 border-bottom border-secondary">
                    <small class="text-info font-monospace"><i class="bi bi-hdd-network me-1"></i>AZDEV TERMINAL</small>
                    <button class="btn btn-sm text-secondary p-0" onclick="toggleTerminal()"><i class="bi bi-x-lg"></i></button>
                </div>
                <div id="xterm-wrapper"></div>
            </div>

        </div>
    </div>
</div>

<div class="offcanvas offcanvas-start bg-dark text-white" id="sidebarMobile">
    <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title">Arquivos</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0">
        <div class="list-group list-group-flush" id="fileListMobile"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/css/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.8.0/lib/addon-fit.min.js"></script>

<script>
    // --- CONFIGURAÇÃO GLOBAL ---
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com/api/notes"; 
    let pyodideInstance = null;
    let globalFiles = []; 
    let term = null;
    let fitAddon = null;
    let isPythonMode = false;
    let currentInput = "";

    // --- SETUP DO CODEMIRROR ---
    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        lineNumbers: true, 
        theme: "dracula", 
        mode: "python",
        extraKeys: {"Ctrl-Space": "autocomplete"},
        lineWrapping: true,
        indentUnit: 4
    });

    // --- SETUP DO TERMINAL (XTERM.JS) ---
    function initTerminal() {
        if (term) return; // Evita recriar
        
        term = new Terminal({
            cursorBlink: true,
            fontFamily: '"Fira Code", monospace',
            fontSize: 14,
            theme: { background: '#000000', foreground: '#00ff00' },
            convertEol: true // Importante para quebra de linha correta
        });
        
        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('xterm-wrapper'));
        fitAddon.fit();
        
        term.writeln('\x1B[1;36mAzDev Studio Terminal [v2.0]\x1B[0m');
        term.writeln('Connected to GitHub API. Type \x1B[1;33mhelp\x1B[0m.');
        prompt();

        term.onData(e => handleTerminalInput(e));
    }

    function prompt() {
        term.write('\r\n\x1B[1;34mazdev@cloud\x1B[0m:\x1B[1;32m~/workspace\x1B[0m$ ');
    }

    function handleTerminalInput(e) {
        if (e === '\r') { // Enter
            term.write('\r\n');
            processCommand(currentInput.trim());
            currentInput = "";
        } else if (e === '\u007F') { // Backspace
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                term.write('\b \b');
            }
        } else {
            currentInput += e;
            term.write(e);
        }
    }

    async function processCommand(cmdLine) {
        if (!cmdLine) { if(!isPythonMode) prompt(); return; }

        if (isPythonMode) {
            if (cmdLine === 'exit()') {
                isPythonMode = false;
                term.writeln('Exiting Python...');
                prompt();
            } else {
                await runPythonLine(cmdLine);
            }
            return;
        }

        const args = cmdLine.split(' ');
        const cmd = args[0];
        const arg1 = args[1];

        switch (cmd) {
            case 'help':
                term.writeln('  ls          List files');
                term.writeln('  cat [file]  Open file in editor');
                term.writeln('  rm [file]   Delete file');
                term.writeln('  python      Start Python Shell');
                term.writeln('  run         Execute current code');
                term.writeln('  clear       Clear screen');
                break;
            case 'ls':
                if(globalFiles.length === 0) await fetchFileList(); 
                globalFiles.forEach(f => term.writeln(`  ${f.name}`));
                break;
            case 'cat':
                if(arg1) { loadFile(arg1); term.writeln(`Opening ${arg1}...`); }
                else term.writeln('Usage: cat filename');
                break;
            case 'rm':
                if(arg1) { 
                    document.getElementById('fileName').value = arg1; 
                    deleteFile(); 
                } else term.writeln('Usage: rm filename');
                break;
            case 'clear':
                term.clear();
                break;
            case 'python':
                isPythonMode = true;
                if(!pyodideInstance) {
                    term.writeln('Booting Pyodide engine (WASM)...');
                    pyodideInstance = await loadPyodide();
                }
                term.writeln('\x1B[1;33mPython 3.11 Ready.\x1B[0m');
                term.write('>>> ');
                return; // Retorna para não dar prompt bash
            case 'run':
                await runPythonCode(editor.getValue());
                break;
            default:
                term.writeln(`Command not found: ${cmd}`);
        }
        if(!isPythonMode) prompt();
    }

    function toggleTerminal() {
        document.body.classList.toggle('show-terminal');
        const container = document.getElementById('terminal-container');
        
        if (document.body.classList.contains('show-terminal')) {
            setTimeout(() => {
                initTerminal();
                fitAddon.fit();
                term.focus();
            }, 50);
        }
    }

    // --- PYTHON LOGIC ---
    async function runPythonCode(code) {
        if(!document.body.classList.contains('show-terminal')) toggleTerminal();
        if (!pyodideInstance) {
            term.writeln('Loading Python...');
            pyodideInstance = await loadPyodide();
        }
        try {
            term.writeln('\x1B[1;32m--- Running Script ---\x1B[0m');
            // Redireciona print() para o xterm
            pyodideInstance.setStdout({ batched: (msg) => term.writeln(msg) });
            await pyodideInstance.runPythonAsync(code);
            term.writeln('\x1B[1;32m--- Done ---\x1B[0m');
        } catch (err) {
            term.writeln(`\x1B[1;31mRuntime Error:\x1B[0m ${err}`);
        }
    }

    async function runPythonLine(line) {
        try {
            pyodideInstance.setStdout({ batched: (msg) => term.writeln(msg) });
            let res = await pyodideInstance.runPythonAsync(line);
            if(res !== undefined) term.writeln(String(res));
        } catch(err) {
            term.writeln(`Error: ${err}`);
        }
        term.write('>>> ');
    }

    // --- LÓGICA DE ARQUIVOS E EDITOR ---
    const templates = {
        html: `<!DOCTYPE html>\n<html lang="pt-br">\n<head>\n    <meta charset="UTF-8">\n    <title>New Project</title>\n</head>\n<body>\n    <h1>Hello World</h1>\n</body>\n</html>`,
        py: `import sys\n\ndef main():\n    print(f"Python {sys.version} running in browser!")\n\nif __name__ == "__main__":\n    main()`,
        js: `console.log("AzDev Studio initialized");`,
        css: `body { background: #1a1a1a; color: white; }`,
        md: `# Notes\n\n- Item 1\n- Item 2`
    };

    function applyTemplate(val) {
        if (editor.getValue().trim() !== "") return;
        const ext = val.split('.').pop().toLowerCase();
        
        // Ajuste de Highlight
        const modes = { 
            html: 'htmlmixed', py: 'python', js: 'javascript', 
            css: 'css', md: 'markdown', txt: 'text' 
        };
        editor.setOption("mode", modes[ext] || 'text');

        if (templates[ext]) editor.setValue(templates[ext]);
    }

    async function fetchFileList() {
        const listEl = document.getElementById('fileList');
        const listMob = document.getElementById('fileListMobile');
        
        try {
            const r = await fetch(`${BACKEND_URL}?t=${Date.now()}`);
            const files = await r.json();
            globalFiles = files; // Cache para o terminal

            const buildList = (container) => {
                container.innerHTML = '';
                if(files.length === 0) {
                    container.innerHTML = '<div class="p-3 text-muted small">Pasta vazia.</div>';
                    return;
                }
                files.forEach(f => {
                    if(f.type === 'file') {
                        const btn = document.createElement('button');
                        btn.className = 'list-group-item list-group-item-action border-0 px-3 py-2 small';
                        // Ícone baseado na extensão
                        let icon = 'bi-file-text';
                        if(f.name.endsWith('.py')) icon = 'bi-filetype-py';
                        if(f.name.endsWith('.html')) icon = 'bi-filetype-html';
                        if(f.name.endsWith('.js')) icon = 'bi-filetype-js';
                        
                        btn.innerHTML = `<i class="bi ${icon} me-2 text-secondary"></i>${f.name}`;
                        btn.onclick = () => loadFile(f.name);
                        container.appendChild(btn);
                    }
                });
            };
            buildList(listEl);
            buildList(listMob);
        } catch (e) {
            console.error(e);
            listEl.innerHTML = '<div class="text-danger p-3 small">Erro de conexão.</div>';
        }
    }

    async function loadFile(name) {
        setStatus("Abrindo...", "warning");
        try {
            const r = await fetch(`${BACKEND_URL}/${name}`);
            const data = await r.json();
            const content = decodeURIComponent(escape(atob(data.content))); // B64 -> UTF8
            
            document.getElementById('fileName').value = data.name;
            
            // 1. Carrega no CodeMirror
            editor.setValue(content);
            applyTemplate(data.name); // Ajusta syntax highlight

            // 2. Carrega no Visual se aberto
            const rich = document.getElementById('rich-editor');
            if(document.body.classList.contains('word-mode')) {
                rich.innerText = content;
            }

            setStatus("Pronto", "success");
        } catch (e) {
            setStatus("Erro ao abrir", "danger");
        }
    }

    async function saveToGitHub() {
        const name = document.getElementById('fileName').value;
        if (!name) return alert("Dê um nome ao arquivo!");
        
        setStatus("Salvando...", "warning");

        // Sync Word -> Code se necessário
        if(document.body.classList.contains('word-mode')) {
             editor.setValue(document.getElementById('rich-editor').innerText);
        }

        try {
            let sha = "";
            try {
                const check = await fetch(`${BACKEND_URL}/${name}`);
                if (check.ok) { const d = await check.json(); sha = d.sha; }
            } catch(e) {}

            const res = await fetch(`${BACKEND_URL}/${name}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Update ${name} via Studio`,
                    content: btoa(unescape(encodeURIComponent(editor.getValue()))),
                    sha: sha || null
                })
            });

            if(res.ok) {
                setStatus("Salvo!", "success");
                if(!sha) fetchFileList(); // Atualiza lista se novo
            } else {
                setStatus("Erro no envio", "danger");
            }
        } catch (e) { setStatus("Falha de rede", "danger"); }
    }

    async function deleteFile() {
        const name = document.getElementById('fileName').value;
        if (!name || !confirm(`Excluir ${name} permanentemente?`)) return;
        
        try {
            const check = await fetch(`${BACKEND_URL}/${name}`);
            const d = await check.json();
            await fetch(`${BACKEND_URL}/${name}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Delete", sha: d.sha })
            });
            document.getElementById('fileName').value = "";
            editor.setValue("");
            fetchFileList();
        } catch (e) { setStatus("Erro ao excluir", "danger"); }
    }

    // --- UI HELPERS ---
    function switchMode(mode) {
        const rich = document.getElementById('rich-editor');
        const codeBtn = document.getElementById('btn-code');
        const wordBtn = document.getElementById('btn-word');

        if(mode === 'word') {
            document.body.classList.add('word-mode');
            // Transfere código para texto visual
            rich.innerText = editor.getValue();
            codeBtn.classList.replace('btn-primary', 'btn-outline-secondary');
            wordBtn.classList.replace('btn-outline-secondary', 'btn-light');
        } else {
            document.body.classList.remove('word-mode');
            // Transfere texto visual para código
            editor.setValue(rich.innerText);
            wordBtn.classList.replace('btn-light', 'btn-outline-secondary');
            codeBtn.classList.replace('btn-outline-secondary', 'btn-primary');
            editor.refresh(); // CodeMirror precisa de refresh ao reaparecer
        }
    }

    function runPreview() {
        const win = window.open("", "Preview", "width=800,height=600");
        win.document.write(editor.getValue());
        win.document.close();
    }

    function execCmd(cmd) { document.execCommand(cmd, false, null); }
    
    function setStatus(msg, type) {
        const b = document.getElementById('status-badge');
        b.innerText = msg;
        b.className = `badge bg-${type}`;
        setTimeout(() => { if(b.innerText === msg && type !== 'secondary') setStatus("Pronto", "secondary"); }, 3000);
    }

    // --- INIT ---
    window.onload = () => {
        fetchFileList();
        // Ajuste de resize
        window.addEventListener('resize', () => { if(fitAddon) fitAddon.fit(); });
    };
</script>

</body>
</html>
