<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Code & Doc Studio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.css">

    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background: #0b0e14; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        .CodeMirror { flex: 1; height: auto; font-family: 'Fira Code', monospace; font-size: 14px; }
        
        /* Estilo para simular Word */
        .word-mode .CodeMirror { display: none; }
        #rich-editor { display: none; flex: 1; background: white; color: black; padding: 40px; overflow-y: auto; outline: none; }
        .word-mode #rich-editor { display: block; }
        
        .toolbar-word { display: none; gap: 5px; padding: 5px; background: #f8f9fa; border-radius: 5px; margin-bottom: 5px; }
        .word-mode .toolbar-word { display: flex; }

        @media (max-width: 768px) { .btn-text { display: none; } }
    </style>
</head>
<body class="code-mode">

<div class="app-container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom px-3">
        <button class="btn btn-outline-secondary me-2 d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarFiles"><i class="bi bi-list"></i></button>
        <span class="navbar-brand mb-0 h1">AzDev Studio</span>
        
        <div class="ms-auto d-flex align-items-center gap-2">
            <div class="btn-group btn-group-sm">
                <button class="btn btn-primary" onclick="switchMode('code')"><i class="bi bi-code"></i> Code</button>
                <button class="btn btn-light" onclick="switchMode('word')"><i class="bi bi-file-word"></i> Word</button>
            </div>
            <select id="languageSelect" class="form-select form-select-sm" style="width: auto;">
                <option value="htmlmixed">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JS</option>
                <option value="python">Python</option>
            </select>
        </div>
    </nav>

    <div class="row g-0 flex-grow-1 overflow-hidden">
        <div class="col-md-3 col-lg-2 bg-body-tertiary border-end d-none d-md-block p-3 overflow-auto">
            <div class="list-group list-group-flush" id="fileList"></div>
        </div>

        <div class="col-md-9 col-lg-10 p-2 d-flex flex-column overflow-hidden">
            <div class="toolbar-word border shadow-sm">
                <button class="btn btn-sm btn-outline-dark" onclick="execCmd('bold')"><b>B</b></button>
                <button class="btn btn-sm btn-outline-dark" onclick="execCmd('italic')"><i>I</i></button>
                <button class="btn btn-sm btn-outline-dark" onclick="execCmd('insertUnorderedList')"><i class="bi bi-list-ul"></i></button>
                <button class="btn btn-sm btn-outline-dark" onclick="execCmd('justifyLeft')"><i class="bi bi-text-left"></i></button>
                <button class="btn btn-sm btn-outline-dark" onclick="execCmd('justifyCenter')"><i class="bi bi-text-center"></i></button>
            </div>

            <div class="input-group mb-2">
                <input type="text" id="fileName" class="form-control form-control-sm" placeholder="nome.html">
                <button class="btn btn-sm btn-success" onclick="saveToGitHub()"><i class="bi bi-save"></i> <span class="btn-text">Salvar</span></button>
            </div>
            
            <textarea id="code-editor"></textarea>
            <div id="rich-editor" contenteditable="true"></div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-start" id="sidebarFiles">
    <div class="offcanvas-body p-0"><div class="list-group list-group-flush" id="fileListMobile"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/javascript-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/html-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/css-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.min.js"></script>

<script>
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com/api/notes";
    let currentMode = 'code';

    // Configuração do Editor CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        lineNumbers: true,
        theme: "dracula",
        mode: "htmlmixed",
        extraKeys: {"Ctrl-Space": "autocomplete"}, // Atalho VS Code para completar
        autoCloseTags: true,
        autoCloseBrackets: true
    });

    // Auto-completar enquanto digita (IntelliSense)
    editor.on("inputRead", function(cm, change) {
        if (change.text[0].match(/[a-z]/i)) {
            cm.showHint({ completeSingle: false });
        }
    });

    function switchMode(mode) {
        currentMode = mode;
        if(mode === 'word') {
            document.body.classList.add('word-mode');
            document.getElementById('rich-editor').innerHTML = editor.getValue();
        } else {
            document.body.classList.remove('word-mode');
            editor.setValue(document.getElementById('rich-editor').innerHTML);
        }
    }

    function execCmd(cmd) { document.execCommand(cmd, false, null); }

    // Funções de API (Lista, Salvar, Abrir)
    async function fetchFileList() {
        try {
            const r = await fetch(`${BACKEND_URL}?t=${Date.now()}`);
            const files = await r.json();
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            files.forEach(f => {
                if(f.type === 'file') {
                    const btn = document.createElement('button');
                    btn.className = 'list-group-item list-group-item-action border-0 small';
                    btn.innerHTML = `<i class="bi bi-file-code me-2"></i>${f.name}`;
                    btn.onclick = () => loadFile(f.name);
                    list.appendChild(btn);
                }
            });
        } catch (e) { console.error("Erro ao listar"); }
    }

    async function loadFile(name) {
        try {
            const r = await fetch(`${BACKEND_URL}/${name}`);
            const data = await r.json();
            const content = decodeURIComponent(escape(atob(data.content)));
            document.getElementById('fileName').value = data.name;
            
            if(currentMode === 'word') document.getElementById('rich-editor').innerHTML = content;
            else editor.setValue(content);
            
            // Detectar linguagem
            const ext = name.split('.').pop();
            const modes = { 'py': 'python', 'js': 'javascript', 'html': 'htmlmixed', 'css': 'css' };
            if(modes[ext]) {
                editor.setOption("mode", modes[ext]);
                document.getElementById('languageSelect').value = modes[ext];
            }
        } catch (e) { alert("Erro ao carregar"); }
    }

    async function saveToGitHub() {
        const name = document.getElementById('fileName').value;
        const text = currentMode === 'word' ? document.getElementById('rich-editor').innerHTML : editor.getValue();
        if (!name) return alert("Nome do arquivo vazio!");

        try {
            let sha = "";
            const check = await fetch(`${BACKEND_URL}/${name}`);
            if (check.ok) { const d = await check.json(); sha = d.sha; }

            const r = await fetch(`${BACKEND_URL}/${name}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `AzDev Update: ${name}`,
                    content: btoa(unescape(encodeURIComponent(text))),
                    sha: sha || null
                })
            });
            if (r.ok) { alert("Salvo com sucesso!"); fetchFileList(); }
        } catch (e) { alert("Erro ao salvar"); }
    }

    window.onload = fetchFileList;
</script>
</body>
</html>
