<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Code Editor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">

    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        
        /* Ajuste do Editor para ocupar tela cheia */
        .CodeMirror { flex: 1; height: auto; font-size: 14px; border-radius: 8px; }
        
        .editor-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Estilo Mobile */
        @media (max-width: 768px) {
            .navbar-brand { font-size: 1.1rem; }
            .btn-text { display: none; } /* Esconde texto dos botões no mobile */
        }

        .file-list-mobile { max-height: 30vh; overflow-y: auto; }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom px-3">
        <div class="container-fluid p-0">
            <button class="btn btn-outline-secondary me-2 d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarFiles">
                <i class="bi bi-list"></i>
            </button>
            <span class="navbar-brand mb-0 h1"><i class="bi bi-code-slash me-2"></i>AzDev Notes</span>
            
            <div class="ms-auto d-flex align-items-center">
                <select id="languageSelect" class="form-select form-select-sm me-2" style="width: auto;">
                    <option value="htmlmixed">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                </select>
                <span id="status-badge" class="badge bg-secondary">Offline</span>
            </div>
        </div>
    </nav>

    <div class="row g-0 content-area flex-grow-1 overflow-hidden">
        <div class="col-md-3 col-lg-2 bg-body-tertiary border-right d-none d-md-block p-3 overflow-auto">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <small class="fw-bold">NOTAS</small>
                <button class="btn btn-sm btn-link p-0" onclick="fetchFileList()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="list-group list-group-flush" id="fileList"></div>
        </div>

        <div class="col-md-9 col-lg-10 p-2 p-md-3 editor-wrapper">
            <div class="input-group mb-2">
                <input type="text" id="fileName" class="form-control form-control-sm" placeholder="arquivo.py">
                <button class="btn btn-sm btn-success" onclick="saveToGitHub()">
                    <i class="bi bi-cloud-upload"></i> <span class="btn-text">Salvar</span>
                </button>
                <button class="btn btn-sm btn-danger" onclick="deleteFile()">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
            
            <textarea id="code-editor"></textarea>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarFiles">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title">Arquivos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0">
        <div class="list-group list-group-flush" id="fileListMobile"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.min.js"></script>

<script>
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com/api/notes";

    // Inicializar CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        lineNumbers: true,
        theme: "dracula",
        mode: "python",
        tabSize: 4,
        indentUnit: 4,
        lineWrapping: true
    });

    // Mudar linguagem do editor
    document.getElementById('languageSelect').addEventListener('change', (e) => {
        editor.setOption("mode", e.target.value);
    });

    function setStatus(msg, type = 'secondary') {
        const b = document.getElementById('status-badge');
        b.innerText = msg; b.className = `badge bg-${type}`;
    }

    async function fetchFileList() {
        setStatus("Sincronizando...", "warning");
        try {
            const r = await fetch(`${BACKEND_URL}?t=${Date.now()}`);
            if (!r.ok) throw new Error();
            const files = await r.json();
            
            const renderList = (id) => {
                const el = document.getElementById(id);
                el.innerHTML = '';
                files.forEach(f => {
                    if(f.type === 'file') {
                        const btn = document.createElement('button');
                        btn.className = 'list-group-item list-group-item-action border-0';
                        btn.innerHTML = `<i class="bi bi-file-earmark-code me-2"></i>${f.name}`;
                        btn.onclick = () => {
                            loadFile(f.name);
                            if(id === 'fileListMobile') bootstrap.Offcanvas.getInstance(document.getElementById('sidebarFiles')).hide();
                        };
                        el.appendChild(btn);
                    }
                });
            };
            
            renderList('fileList');
            renderList('fileListMobile');
            setStatus("Conectado", "success");
        } catch (e) { setStatus("Erro 401", "danger"); }
    }

    async function loadFile(name) {
        setStatus("Lendo...", "info");
        try {
            const r = await fetch(`${BACKEND_URL}/${name}`);
            const data = await r.json();
            document.getElementById('fileName').value = data.name;
            
            // Decodificar e setar no editor
            const content = decodeURIComponent(escape(atob(data.content)));
            editor.setValue(content);
            
            // Tentar detectar linguagem pela extensão
            const ext = name.split('.').pop();
            const modes = { 'py': 'python', 'js': 'javascript', 'html': 'htmlmixed', 'css': 'css' };
            if(modes[ext]) {
                editor.setOption("mode", modes[ext]);
                document.getElementById('languageSelect').value = modes[ext];
            }
            
            setStatus("Editando", "primary");
        } catch (e) { setStatus("Erro", "danger"); }
    }

    async function saveToGitHub() {
        const name = document.getElementById('fileName').value;
        const text = editor.getValue();
        if (!name) return alert("Nome do arquivo vazio!");

        setStatus("Salvando...", "warning");
        try {
            let sha = "";
            const check = await fetch(`${BACKEND_URL}/${name}`);
            if (check.ok) { const d = await check.json(); sha = d.sha; }

            const r = await fetch(`${BACKEND_URL}/${name}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `AzDev Edit: ${name}`,
                    content: btoa(unescape(encodeURIComponent(text))),
                    sha: sha || null
                })
            });
            if (r.ok) { setStatus("Salvo!", "success"); fetchFileList(); }
        } catch (e) { setStatus("Erro ao salvar", "danger"); }
    }

    async function deleteFile() {
        const name = document.getElementById('fileName').value;
        if (!name || !confirm("Excluir?")) return;
        try {
            const check = await fetch(`${BACKEND_URL}/${name}`);
            const d = await check.json();
            await fetch(`${BACKEND_URL}/${name}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Delete", sha: d.sha })
            });
            document.getElementById('fileName').value = "";
            editor.setValue("");
            fetchFileList();
        } catch (e) { setStatus("Erro", "danger"); }
    }

    window.onload = fetchFileList;
</script>
</body>
</html>
