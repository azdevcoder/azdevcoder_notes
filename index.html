<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Notes - GitHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        /* Ajuste para fazer a tela ocupar 100% da altura (estilo App) */
        body, html { height: 100%; overflow: hidden; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        .content-area { flex: 1; overflow: hidden; } 
        .file-list-container { overflow-y: auto; height: 100%; border-right: 1px solid var(--bs-border-color); }
        .editor-container { display: flex; flex-direction: column; height: 100%; }
        textarea { resize: none; font-family: monospace; font-size: 1.1rem; }
        
        /* Ajuste mobile: lista com altura máxima */
        @media (max-width: 768px) {
            .file-list-container { height: 150px; border-right: none; border-bottom: 1px solid var(--bs-border-color); }
        }
    </style>
</head>
<body>

<div class="container-fluid p-0 app-container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom px-3">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-github me-2"></i>AzDev Notes</span>
        <div class="ms-auto">
             <span id="status-badge" class="badge bg-secondary">Aguardando...</span>
        </div>
    </nav>

    <div class="row g-0 content-area">
        <div class="col-md-3 col-lg-2 bg-body-tertiary file-list-container p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="m-0 text-muted">PASTA: /NOTES</h6>
                <button class="btn btn-sm btn-outline-primary" onclick="fetchFileList()" title="Atualizar">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
            <div class="list-group list-group-flush" id="fileList">
                <div class="text-center mt-3 text-muted spinner-border spinner-border-sm" role="status"></div>
            </div>
        </div>

        <div class="col-md-9 col-lg-10 p-3 bg-body editor-container">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-file-earmark-text"></i></span>
                <input type="text" id="fileName" class="form-control" placeholder="Nome do arquivo (ex: reuniao.md)">
                
                <button class="btn btn-success" onclick="saveToGitHub()" title="Salvar arquivo">
                    <i class="bi bi-cloud-upload me-1"></i> Salvar
                </button>
                
                <button class="btn btn-danger" onclick="deleteFile()" title="Excluir arquivo atual">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
            
            <textarea id="content" class="form-control flex-grow-1" placeholder="Selecione um arquivo ou crie um novo..."></textarea>
            
            <div class="mt-2 text-end text-muted small">
                <small>API GitHub v3 • AzDev Coder</small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- CONFIGURAÇÕES ---
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com"
    
    const REPO_OWNER = 'azdevcoder';
    const REPO_NAME = 'azdevcoder_notes';
    const PATH = 'notes'; // Pasta onde os arquivos ficam

    // URL CORRIGIDA: aponta para dentro da pasta 'notes'
    const BASE_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${PATH}`;

    function setStatus(msg, type = 'secondary') {
        const badge = document.getElementById('status-badge');
        badge.innerText = msg;
        badge.className = `badge bg-${type}`;
    }

    // 1. LISTAR ARQUIVOS
    async function fetchFileList() {
        setStatus("Carregando lista...", "warning");
        const listElement = document.getElementById('fileList');
        
        
        try {
            const response = await fetch(`${BACKEND_URL}?t=${new Date().getTime()}`);
            
            if (!response.ok) throw new Error("Falha na conexão (Verifique Token/Repo)");

            const files = await response.json();
            listElement.innerHTML = '';

            // Se a pasta estiver vazia ou não existir
            if (!Array.isArray(files)) {
                listElement.innerHTML = '<div class="text-muted small">Nenhum arquivo encontrado.</div>';
                setStatus("Pasta vazia", "secondary");
                return;
            }

            files.forEach(file => {
                if(file.type === 'file') {
                    const btn = document.createElement('button');
                    btn.className = 'list-group-item list-group-item-action py-2 border-0';
                    btn.innerHTML = `<i class="bi bi-file-text me-2"></i> ${file.name}`;
                    
                    // CORREÇÃO CRÍTICA: Passamos apenas o nome do arquivo, não o path completo
                    // pois a BASE_URL já inclui a pasta "notes"
                    btn.onclick = () => loadFile(file.name);
                    
                    listElement.appendChild(btn);
                }
            });
            setStatus("Pronto", "success");
        } catch (err) {
            console.error(err);
            listElement.innerHTML = '<div class="text-danger small">Erro. Verifique Console.</div>';
            setStatus("Erro", "danger");
        }
    }

    // 2. CARREGAR ARQUIVO
    async function loadFile(fileName) {
        setStatus("Baixando...", "info");
        try {
            const url = `${BASE_URL}/${fileName}?t=${new Date().getTime()}`;
            const response = await fetch(url, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });
            
            if(!response.ok) throw new Error("Arquivo não encontrado");

            const data = await response.json();
            
            // Decodifica UTF-8 corretamente
            const decodedContent = decodeURIComponent(escape(atob(data.content)));
            
            document.getElementById('fileName').value = data.name;
            document.getElementById('content').value = decodedContent;
            setStatus("Carregado", "primary");
        } catch (err) {
            console.error(err);
            setStatus("Erro ao abrir", "danger");
        }
    }

    // 3. SALVAR ARQUIVO
    async function saveToGitHub() {
        const fileName = document.getElementById('fileName').value;
        const content = document.getElementById('content').value;

        if (!fileName) return alert("Por favor, dê um nome ao arquivo.");

        setStatus("Enviando...", "warning");

        try {
            let sha = "";
            // Verifica se arquivo existe na pasta notes para pegar o SHA
            const checkFile = await fetch(`${BASE_URL}/${fileName}`, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });
            
            if (checkFile.ok) {
                const fileData = await checkFile.json();
                sha = fileData.sha;
            }

            const response = await fetch(`${BASE_URL}/${fileName}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    message: `Update via WebApp: ${fileName}`,
                    // Encodifica UTF-8 para Base64
                    content: btoa(unescape(encodeURIComponent(content))),
                    sha: sha || null
                })
            });

            if (response.ok) {
                setStatus("Salvo!", "success");
                // Se era um arquivo novo (sem SHA), atualiza a lista
                if (!sha) fetchFileList(); 
            } else {
                const err = await response.json();
                setStatus("Erro ao salvar", "danger");
                alert("Erro GitHub: " + (err.message || "Desconhecido"));
            }
        } catch (err) {
            console.error(err);
            setStatus("Erro de conexão", "danger");
        }
    }

    // 4. EXCLUIR ARQUIVO
    async function deleteFile() {
        const fileName = document.getElementById('fileName').value;
        
        if (!fileName) return alert("Selecione um arquivo para excluir.");

        if (!confirm(`Tem certeza que deseja EXCLUIR PERMANENTEMENTE "${fileName}"?`)) {
            return;
        }

        setStatus("Excluindo...", "danger");

        try {
            // Busca SHA para autorizar exclusão
            const checkFile = await fetch(`${BASE_URL}/${fileName}`, {
                headers: { "Authorization": `token ${GITHUB_TOKEN}` }
            });

            if (!checkFile.ok) {
                setStatus("404 Não encontrado", "warning");
                return alert("Arquivo não existe no repositório.");
            }

            const fileData = await checkFile.json();
            const sha = fileData.sha;

            const response = await fetch(`${BASE_URL}/${fileName}`, {
                method: "DELETE",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    message: `Delete via WebApp: ${fileName}`,
                    sha: sha
                })
            });

            if (response.ok) {
                setStatus("Excluído", "success");
                document.getElementById('fileName').value = "";
                document.getElementById('content').value = "";
                fetchFileList();
            } else {
                const err = await response.json();
                setStatus("Erro ao excluir", "danger");
                alert("Erro GitHub: " + err.message);
            }
        } catch (err) {
            console.error(err);
            setStatus("Erro de conexão", "danger");
        }
    }

    // Inicializa
    window.onload = fetchFileList;
</script>

</body>
</html>
