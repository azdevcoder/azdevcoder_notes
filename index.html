<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Studio - Code & Word</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.css">

    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background: #0f111a; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        .CodeMirror { flex: 1; height: auto; font-family: 'Fira Code', monospace; font-size: 14px; border-radius: 0 0 8px 8px; }
        
        /* Estilo Word */
        #rich-editor { display: none; flex: 1; background: white; color: black; padding: 30px; overflow-y: auto; outline: none; border-radius: 0 0 8px 8px; }
        .word-mode #rich-editor { display: block; }
        .word-mode .CodeMirror { display: none; }
        
        .toolbar-word { display: none; gap: 5px; padding: 8px; background: #eee; border-radius: 8px 8px 0 0; }
        .word-mode .toolbar-word { display: flex; }

        @media (max-width: 768px) { .btn-text { display: none; } }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom px-3">
        <button class="btn btn-outline-secondary me-2 d-md-none" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile"><i class="bi bi-list"></i></button>
        <span class="navbar-brand mb-0 h1">AzDev Studio</span>
        
        <div class="ms-auto d-flex align-items-center gap-2">
            <div class="btn-group btn-group-sm">
                <button id="btn-code" class="btn btn-primary active" onclick="switchMode('code')">Code</button>
                <button id="btn-word" class="btn btn-outline-light" onclick="switchMode('word')">Word</button>
            </div>
            <select id="languageSelect" class="form-select form-select-sm" style="width: auto;">
                <option value="htmlmixed">HTML</option>
                <option value="javascript">JS</option>
                <option value="python">Python</option>
                <option value="css">CSS</option>
            </select>
            <span id="status-badge" class="badge bg-secondary">Status</span>
        </div>
    </nav>

    <div class="row g-0 flex-grow-1 overflow-hidden">
        <div class="col-md-3 col-lg-2 bg-body-tertiary border-end d-none d-md-block p-3 overflow-auto">
            <div class="d-flex justify-content-between mb-3">
                <small class="fw-bold">ARQUIVOS</small>
                <button class="btn btn-sm btn-link p-0" onclick="fetchFileList()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="list-group list-group-flush" id="fileList"></div>
        </div>

        <div class="col-md-9 col-lg-10 p-2 p-md-4 d-flex flex-column overflow-hidden">
            <div class="toolbar-word border-bottom">
                <button class="btn btn-sm btn-dark" onclick="execCmd('bold')"><b>B</b></button>
                <button class="btn btn-sm btn-dark" onclick="execCmd('italic')"><i>I</i></button>
                <button class="btn btn-sm btn-dark" onclick="execCmd('underline')"><u>U</u></button>
                <button class="btn btn-sm btn-dark" onclick="execCmd('insertUnorderedList')"><i class="bi bi-list-ul"></i></button>
            </div>

            <div class="input-group mb-2 mt-2">
                <input type="text" id="fileName" class="form-control form-control-sm" placeholder="nome.py">
                <button class="btn btn-sm btn-success" onclick="saveToGitHub()"><i class="bi bi-save"></i> <span class="btn-text">Salvar</span></button>
                <button class="btn btn-sm btn-danger" onclick="deleteFile()"><i class="bi bi-trash"></i></button>
            </div>
            
            <textarea id="code-editor"></textarea>
            <div id="rich-editor" contenteditable="true"></div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-start" id="sidebarMobile">
    <div class="offcanvas-header border-bottom"><h5>Arquivos</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body p-0"><div class="list-group list-group-flush" id="fileListMobile"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/xml-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/html-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/javascript-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/addon/hint/css-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com/api/notes";
    let currentMode = 'code';

    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        lineNumbers: true, theme: "dracula", mode: "htmlmixed",
        extraKeys: {"Ctrl-Space": "autocomplete"},
        lineWrapping: true, autoCloseTags: true
    });

    // IntelliSense (Sugestão ao digitar)
    editor.on("inputRead", (cm, change) => {
        if (change.text[0].match(/[a-z0-9]/i)) cm.showHint({ completeSingle: false });
    });

    function setStatus(msg, type = 'secondary') {
        const b = document.getElementById('status-badge');
        b.innerText = msg; b.className = `badge bg-${type}`;
    }

    function switchMode(mode) {
        currentMode = mode;
        const rich = document.getElementById('rich-editor');
        if(mode === 'word') {
            document.body.classList.add('word-mode');
            rich.innerHTML = editor.getValue();
            document.getElementById('btn-word').className = "btn btn-light active";
            document.getElementById('btn-code').className = "btn btn-outline-primary";
        } else {
            document.body.classList.remove('word-mode');
            editor.setValue(rich.innerHTML);
            document.getElementById('btn-code').className = "btn btn-primary active";
            document.getElementById('btn-word').className = "btn btn-outline-light";
        }
    }

    function execCmd(cmd) { document.execCommand(cmd, false, null); }

    async function fetchFileList() {
        setStatus("Lendo...", "warning");
        try {
            const r = await fetch(`${BACKEND_URL}?t=${Date.now()}`);
            const files = await r.json();
            const updateList = (id) => {
                const el = document.getElementById(id);
                el.innerHTML = '';
                files.forEach(f => {
                    if(f.type === 'file') {
                        const b = document.createElement('button');
                        b.className = 'list-group-item list-group-item-action border-0 small';
                        b.innerHTML = `<i class="bi bi-file-earmark-code me-2"></i>${f.name}`;
                        b.onclick = () => loadFile(f.name);
                        el.appendChild(b);
                    }
                });
            };
            updateList('fileList');
            updateList('fileListMobile');
            setStatus("Pronto", "success");
        } catch (e) { setStatus("Erro 401", "danger"); }
    }

    async function loadFile(name) {
        setStatus("Abrindo...", "info");
        try {
            const r = await fetch(`${BACKEND_URL}/${name}`);
            const data = await r.json();
            const content = decodeURIComponent(escape(atob(data.content)));
            document.getElementById('fileName').value = data.name;
            if(currentMode === 'word') document.getElementById('rich-editor').innerHTML = content;
            else editor.setValue(content);
            setStatus("Editando", "primary");
        } catch (e) { setStatus("Erro", "danger"); }
    }

    async function saveToGitHub() {
        const name = document.getElementById('fileName').value;
        const text = currentMode === 'word' ? document.getElementById('rich-editor').innerHTML : editor.getValue();
        if (!name) return alert("Dê um nome ao arquivo!");
        setStatus("Salvando...", "warning");
        try {
            let sha = "";
            const check = await fetch(`${BACKEND_URL}/${name}`);
            if (check.ok) { const d = await check.json(); sha = d.sha; }
            const r = await fetch(`${BACKEND_URL}/${name}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `AzDev Update: ${name}`,
                    content: btoa(unescape(encodeURIComponent(text))),
                    sha: sha || null
                })
            });
            if (r.ok) { setStatus("Salvo!", "success"); fetchFileList(); }
        } catch (e) { setStatus("Erro", "danger"); }
    }

    async function deleteFile() {
        const name = document.getElementById('fileName').value;
        if (!name || !confirm(`Excluir ${name}?`)) return;
        setStatus("Excluindo...", "danger");
        try {
            const check = await fetch(`${BACKEND_URL}/${name}`);
            const d = await check.json();
            await fetch(`${BACKEND_URL}/${name}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Delete", sha: d.sha })
            });
            document.getElementById('fileName').value = "";
            editor.setValue("");
            document.getElementById('rich-editor').innerHTML = "";
            fetchFileList();
        } catch (e) { setStatus("Erro", "danger"); }
    }

    window.onload = fetchFileList;
</script>
</body>
</html>
