<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Notes - GitHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body, html { height: 100%; overflow: hidden; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        .content-area { flex: 1; overflow: hidden; } 
        .file-list-container { overflow-y: auto; height: 100%; border-right: 1px solid var(--bs-border-color); }
        .editor-container { display: flex; flex-direction: column; height: 100%; }
        textarea { resize: none; font-family: monospace; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container-fluid p-0 app-container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom px-3">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-github me-2"></i>AzDev Notes</span>
        <div class="ms-auto"><span id="status-badge" class="badge bg-secondary">Aguardando...</span></div>
    </nav>

    <div class="row g-0 content-area">
        <div class="col-md-3 col-lg-2 bg-body-tertiary file-list-container p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="m-0 text-muted">PASTA: /NOTES</h6>
                <button class="btn btn-sm btn-outline-primary" onclick="fetchFileList()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="list-group list-group-flush" id="fileList"></div>
        </div>

        <div class="col-md-9 col-lg-10 p-3 bg-body editor-container">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-file-earmark-text"></i></span>
                <input type="text" id="fileName" class="form-control" placeholder="reuniao.md">
                <button class="btn btn-success" onclick="saveToGitHub()"><i class="bi bi-cloud-upload"></i> Salvar</button>
                <button class="btn btn-danger" onclick="deleteFile()"><i class="bi bi-trash"></i></button>
            </div>
            <textarea id="content" class="form-control flex-grow-1" placeholder="Selecione ou crie um arquivo..."></textarea>
        </div>
    </div>
</div>

<script>
    // URL do seu backend no Render
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com/api/notes";

    function setStatus(msg, type = 'secondary') {
        const b = document.getElementById('status-badge');
        b.innerText = msg; b.className = `badge bg-${type}`;
    }

    async function fetchFileList() {
        setStatus("Sincronizando...", "warning");
        const listElement = document.getElementById('fileList');
        try {
            const r = await fetch(`${BACKEND_URL}?t=${Date.now()}`);
            if (!r.ok) throw new Error("Erro 401 ou 404");
            const files = await r.json();
            listElement.innerHTML = '';
            files.forEach(f => {
                if(f.type === 'file') {
                    const btn = document.createElement('button');
                    btn.className = 'list-group-item list-group-item-action py-2 border-0';
                    btn.innerHTML = `<i class="bi bi-file-text me-2"></i> ${f.name}`;
                    btn.onclick = () => loadFile(f.name);
                    listElement.appendChild(btn);
                }
            });
            setStatus("Conectado", "success");
        } catch (e) {
            setStatus("Erro de Acesso", "danger");
            listElement.innerHTML = '<small class="text-danger">Verifique o token no Render.</small>';
        }
    }

    async function loadFile(name) {
        setStatus("Abrindo...", "info");
        try {
            const r = await fetch(`${BACKEND_URL}/${name}?t=${Date.now()}`);
            const data = await r.json();
            document.getElementById('fileName').value = data.name;
            document.getElementById('content').value = decodeURIComponent(escape(atob(data.content)));
            setStatus("Editando", "primary");
        } catch (e) { setStatus("Erro ao abrir", "danger"); }
    }

    async function saveToGitHub() {
        const name = document.getElementById('fileName').value;
        const text = document.getElementById('content').value;
        if (!name) return alert("Dê um nome ao arquivo!");
        setStatus("Salvando...", "warning");
        try {
            let sha = "";
            const check = await fetch(`${BACKEND_URL}/${name}`);
            if (check.ok) { const d = await check.json(); sha = d.sha; }

            const r = await fetch(`${BACKEND_URL}/${name}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    message: `Update via WebApp: ${name}`,
                    content: btoa(unescape(encodeURIComponent(text))),
                    sha: sha || null
                })
            });
            if (r.ok) { setStatus("Salvo!", "success"); fetchFileList(); }
            else { setStatus("Erro 401", "danger"); alert("Token inválido no Render!"); }
        } catch (e) { setStatus("Erro de conexão", "danger"); }
    }

    async function deleteFile() {
        const name = document.getElementById('fileName').value;
        if (!name || !confirm("Excluir permanentemente?")) return;
        setStatus("Excluindo...", "danger");
        try {
            const check = await fetch(`${BACKEND_URL}/${name}`);
            const d = await check.json();
            const r = await fetch(`${BACKEND_URL}/${name}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: "Delete", sha: d.sha })
            });
            if (r.ok) {
                document.getElementById('fileName').value = "";
                document.getElementById('content').value = "";
                fetchFileList();
            }
        } catch (e) { setStatus("Erro", "danger"); }
    }

    window.onload = fetchFileList;
</script>
</body>
</html>
