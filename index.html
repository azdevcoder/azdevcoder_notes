<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDev Studio - Terminal Fixed</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/css/xterm.min.css">

    <style>
        /* --- LAYOUT FIXO --- */
        body, html { height: 100%; margin: 0; overflow: hidden; background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; }
        .app-container { height: 100vh; display: flex; flex-direction: column; }
        
        /* Cabeçalho Fixo */
        .fixed-header { flex-shrink: 0; z-index: 1000; background: #161b22; border-bottom: 1px solid #30363d; }
        
        /* Área Principal */
        .main-workspace { flex-grow: 1; display: flex; overflow: hidden; position: relative; }
        .sidebar { width: 250px; background: #0d1117; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .editor-area { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
        
        /* Editores */
        .editor-wrapper { flex-grow: 1; position: relative; overflow: hidden; }
        .CodeMirror { height: 100% !important; font-family: 'Fira Code', monospace; font-size: 14px; background: #0d1117; }
        
        /* Terminal Container */
        #terminal-panel { 
            height: 35%; 
            background: #000; 
            border-top: 1px solid #30363d; 
            display: none; 
            flex-direction: column; 
        }
        .show-terminal #terminal-panel { display: flex; }
        .show-terminal .editor-wrapper { height: 65%; }
        
        #xterm-container { flex-grow: 1; overflow: hidden; padding: 4px; }

        /* Utilitários */
        .btn-icon { background: none; border: none; color: #8b949e; }
        .btn-icon:hover { color: #58a6ff; }
        
        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

<div class="app-container">
    <nav class="navbar navbar-expand-lg fixed-header px-3 py-2">
        <button class="btn btn-icon d-md-none me-2" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i></button>
        <span class="navbar-brand mb-0 h1 text-white fs-6"><i class="bi bi-code-square me-2 text-primary"></i>AzDev Studio</span>
        
        <div class="ms-auto d-flex gap-2">
            <button class="btn btn-sm btn-outline-success" onclick="runPythonScript()" title="Rodar Script"><i class="bi bi-play-fill"></i> Run</button>
            <button class="btn btn-sm btn-outline-secondary" onclick="toggleTerminal()" title="Abrir Terminal"><i class="bi bi-terminal"></i> Term</button>
        </div>
    </nav>

    <div class="main-workspace">
        
        <div class="sidebar" id="sidebar">
            <div class="p-2 border-bottom border-secondary d-flex justify-content-between align-items-center">
                <small class="fw-bold text-muted ps-2">EXPLORER</small>
                <button class="btn btn-icon btn-sm" onclick="fetchFileList()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="list-group list-group-flush overflow-auto" id="fileList"></div>
        </div>

        <div class="editor-area">
            
            <div class="d-flex align-items-center gap-2 p-2 bg-dark border-bottom border-secondary fixed-header">
                <input type="text" id="fileName" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="script.py" style="max-width: 200px;">
                <button class="btn btn-sm btn-primary" onclick="saveFile()"><i class="bi bi-save"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deleteFile()"><i class="bi bi-trash"></i></button>
                <span id="status" class="badge bg-secondary ms-auto">Ready</span>
            </div>

            <div class="editor-wrapper">
                <textarea id="code-editor"></textarea>
            </div>

            <div id="terminal-panel">
                <div class="d-flex justify-content-between align-items-center bg-dark px-2 py-1 border-bottom border-secondary" style="height: 30px;">
                    <small class="text-white-50 font-monospace">BASH (Emulated)</small>
                    <button class="btn btn-icon btn-sm py-0" onclick="toggleTerminal()"><i class="bi bi-x-lg"></i></button>
                </div>
                <div id="xterm-container"></div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.8.0/lib/addon-fit.min.js"></script>

<script>
    // --- CONFIGURAÇÃO ---
    const BACKEND_URL = "https://azdevcoder-notes.onrender.com/api/notes";
    let globalFiles = [];
    let pyodide = null;
    let term = null;
    let fitAddon = null;
    
    // Estado do Terminal
    let inputBuffer = "";
    let isPythonMode = false;

    // --- EDITOR ---
    const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
        lineNumbers: true, theme: "dracula", mode: "python"
    });

    // --- TERMINAL LOGIC (CORRIGIDA) ---
    function initTerminal() {
        if (term) return; // Evita duplicar

        term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: '"Fira Code", monospace',
            theme: { background: '#000000', foreground: '#00ff00' }
        });
        
        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('xterm-container'));
        fitAddon.fit();

        term.writeln('\x1B[1;34mWelcome to AzDev Terminal v2.1\x1B[0m');
        term.writeln('Type \x1B[1;33mhelp\x1B[0m to list commands.');
        prompt();

        // O SEGREDO DO FUNCIONAMENTO ESTÁ AQUI:
        term.onData(e => {
            switch (e) {
                case '\r': // Enter
                    term.write('\r\n');
                    executeCommand(inputBuffer);
                    inputBuffer = "";
                    break;
                case '\u007F': // Backspace
                    if (inputBuffer.length > 0) {
                        inputBuffer = inputBuffer.slice(0, -1);
                        term.write('\b \b'); // Apaga visualmente
                    }
                    break;
                default: // Caracteres normais
                    // Filtra caracteres estranhos (opcional)
                    if (e >= String.fromCharCode(0x20) && e <= String.fromCharCode(0x7E)) {
                        inputBuffer += e;
                        term.write(e); // ECHO: Escreve o que o usuário digita
                    }
            }
        });
    }

    function prompt() {
        if (isPythonMode) {
            term.write('>>> ');
        } else {
            term.write('\r\n\x1B[1;32mazdev@linux\x1B[0m:\x1B[1;34m~\x1B[0m$ ');
        }
    }

    async function executeCommand(cmd) {
        cmd = cmd.trim();
        if (!cmd) { prompt(); return; }

        // --- MODO PYTHON ---
        if (isPythonMode) {
            if (cmd === 'exit()') {
                isPythonMode = false;
                term.writeln('Exiting Python...');
                prompt();
            } else {
                await runPythonLine(cmd);
            }
            return;
        }

        // --- MODO BASH ---
        const parts = cmd.split(' ');
        const command = parts[0];
        const arg = parts[1];

        switch (command) {
            case 'help':
                term.writeln('Commands: ls, cat [file], rm [file], python, clear');
                break;
            case 'clear':
                term.clear();
                break;
            case 'ls':
                if (globalFiles.length === 0) await fetchFileList();
                globalFiles.forEach(f => term.writeln('  ' + f.name));
                break;
            case 'cat':
                if (!arg) term.writeln('Usage: cat filename');
                else {
                    term.writeln(`Loading ${arg}...`);
                    loadFile(arg);
                }
                break;
            case 'rm': // Delete simulado via comando
                if (!arg) term.writeln('Usage: rm filename');
                else {
                    document.getElementById('fileName').value = arg;
                    await deleteFile();
                    term.writeln(`File ${arg} deleted.`);
                }
                break;
            case 'python':
                term.writeln('Starting Python Environment (Pyodide)...');
                if (!pyodide) await loadPyodideEngine();
                isPythonMode = true;
                term.writeln('\x1B[1;33mPython 3.11 Ready.\x1B[0m Type exit() to quit.');
                break;
            default:
                term.writeln(`Command not found: ${command}`);
        }
        
        if (!isPythonMode) prompt();
    }

    // --- PYTHON ENGINE ---
    async function loadPyodideEngine() {
        try {
            pyodide = await loadPyodide();
            // Redireciona o print() do Python para o Xterm
            pyodide.setStdout({ batched: (msg) => {
                term.writeln(msg);
            }});
        } catch (e) {
            term.writeln(`Error loading Python: ${e}`);
        }
    }

    async function runPythonLine(code) {
        try {
            // Executa linha a linha
            let result = await pyodide.runPythonAsync(code);
            if (result !== undefined) term.writeln(String(result));
        } catch (e) {
            term.writeln(`\x1B[1;31m${e}\x1B[0m`);
        }
        term.write('>>> '); // Prompt python
    }

    async function runPythonScript() {
        toggleTerminal(true);
        term.writeln('\x1B[1;36m--- Running Script ---\x1B[0m');
        
        if (!pyodide) {
            term.writeln('Loading engine...');
            await loadPyodideEngine();
        }

        try {
            const code = editor.getValue();
            await pyodide.runPythonAsync(code);
        } catch (e) {
            term.writeln(`\x1B[1;31mRuntime Error:\x1B[0m ${e}`);
        }
        term.writeln('\x1B[1;36m--- End ---\x1B[0m');
        prompt();
    }

    // --- UI & API ---
    function toggleTerminal(forceOpen = false) {
        const body = document.body;
        if (forceOpen) body.classList.add('show-terminal');
        else body.classList.toggle('show-terminal');
        
        if (body.classList.contains('show-terminal')) {
            setTimeout(() => {
                initTerminal(); // Inicia se for a primeira vez
                fitAddon.fit();
                term.focus();
            }, 100);
        }
    }

    async function fetchFileList() {
        try {
            const r = await fetch(`${BACKEND_URL}?t=${Date.now()}`);
            const files = await r.json();
            globalFiles = files; // Cache para o terminal
            
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            files.forEach(f => {
                if (f.type === 'file') {
                    const item = document.createElement('button');
                    item.className = 'list-group-item list-group-item-action bg-transparent text-white border-bottom border-secondary small';
                    item.innerHTML = `<i class="bi bi-file-earmark me-2"></i>${f.name}`;
                    item.onclick = () => loadFile(f.name);
                    list.appendChild(item);
                }
            });
        } catch (e) { alert("Erro ao listar arquivos"); }
    }

    async function loadFile(name) {
        try {
            const r = await fetch(`${BACKEND_URL}/${name}`);
            const data = await r.json();
            const content = decodeURIComponent(escape(atob(data.content)));
            document.getElementById('fileName').value = data.name;
            editor.setValue(content);
        } catch (e) { alert("Erro ao abrir arquivo"); }
    }

    async function saveFile() {
        const name = document.getElementById('fileName').value;
        if (!name) return alert("Nome necessário");
        
        const btn = document.querySelector('.btn-primary');
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        
        try {
            let sha = "";
            try {
                const check = await fetch(`${BACKEND_URL}/${name}`);
                if(check.ok) { const d = await check.json(); sha = d.sha; }
            } catch(e){}

            await fetch(`${BACKEND_URL}/${name}`, {
                method: "PUT",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    message: "Update via Studio",
                    content: btoa(unescape(encodeURIComponent(editor.getValue()))),
                    sha: sha || null
                })
            });
            fetchFileList();
        } catch(e) { alert("Erro ao salvar"); }
        btn.innerHTML = '<i class="bi bi-save"></i>';
    }

    async function deleteFile() {
        const name = document.getElementById('fileName').value;
        if(!name || !confirm('Excluir?')) return;
        
        try {
            const check = await fetch(`${BACKEND_URL}/${name}`);
            const d = await check.json();
            await fetch(`${BACKEND_URL}/${name}`, {
                method: "DELETE",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ message: "Delete", sha: d.sha })
            });
            document.getElementById('fileName').value = "";
            editor.setValue("");
            fetchFileList();
        } catch(e) { alert("Erro ao excluir"); }
    }

    // Inicialização
    window.onload = fetchFileList;
    window.addEventListener('resize', () => { if(fitAddon) fitAddon.fit(); });
</script>

</body>
</html>
